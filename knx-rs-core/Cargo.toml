[package]
name = "knx-rs-core"
description = "Platform-independent KNX protocol types, CEMI frames, and DPT conversions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
homepage.workspace = true
documentation = "https://docs.rs/knx_rs_core"
keywords = ["knx", "home-automation", "cemi", "dpt", "no-std"]
categories = ["embedded", "no-std", "encoding", "hardware-support"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
libm.workspace = true
serde = { workspace = true, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json.workspace = true

[lints]
workspace = true
