name: Feature request
description: Propose a focused addition or behavioral improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case or limitation this proposal addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, protocol behavior, or workflow you propose.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain viable alternatives and why they are insufficient.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note API, MSRV, no_std, wire-format, or platform implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
