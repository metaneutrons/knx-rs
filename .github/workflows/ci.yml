name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

# All jobs only read the repo (checkout + build/lint/test; the audit job uses
# GITHUB_TOKEN solely for advisory-DB rate limits). Restrict the token to a
# read-only default — see CodeQL actions/missing-workflow-permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  commit-convention:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate PR title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same Conventional Commits grammar as .githooks/commit-msg.
          pattern='^(feat|fix|refactor|docs|test|ci|chore|perf|style|build|revert)(\(.+\))?!?: .+'
          fail=0
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $PR_TITLE"
            fail=1
          fi
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            msg=$(git log -1 --format=%s "$sha")
            printf '%s' "$msg" | grep -qE '^(Merge |Revert )' && continue
            if ! printf '%s' "$msg" | grep -qE "$pattern"; then
              echo "::error::Commit ${sha:0:8} is not a Conventional Commit: $msg"
              fail=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$fail" -ne 0 ]; then
            echo "Format: <type>(<scope>): <description>  — types: feat, fix, refactor, docs, test, ci, chore, perf, style, build, revert (optionally '!' for breaking)."
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- --test-threads=1

  test-features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "knx-rs-core: default features"
        run: cargo test -p knx-rs-core
      - name: "knx-rs-core: no_std (no default features)"
        run: cargo check -p knx-rs-core --no-default-features
      - name: "knx-rs-core: serde feature"
        run: cargo test -p knx-rs-core --features serde
      - name: "knx-rs-core: all features"
        run: cargo test -p knx-rs-core --all-features

  no-std:
    name: "no_std (MSRV): ${{ matrix.target }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p knx-rs-core --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p knx-rs-device --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p knx-rs-tp --no-default-features --target ${{ matrix.target }}

  msrv:
    name: MSRV (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071: `rsa` Marvin timing side-channel. No fixed upgrade
          # exists. Not exploitable here — knx-rs-prod signs .knxprod locally with
          # the operator's own key; there is no network-exposed RSA timing oracle.
          ignore: RUSTSEC-2023-0071

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
