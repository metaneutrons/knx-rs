name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      archive: ${{ steps.metadata.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - name: Validate tag, commit, and manifests
        id: metadata
        run: scripts/release/validate-release-tag.sh "$GITHUB_REF_NAME"

  candidate:
    name: Build and verify release candidate
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test --workspace --all-features --locked -- --test-threads=1
      - run: cargo check -p knx-rs-core --no-default-features --locked
      - run: cargo check -p knx-rs-device --no-default-features --locked
      - run: cargo check -p knx-rs-tp --no-default-features --locked
      - name: Build deterministic source archive
        run: scripts/release/build-source-archive.sh "${{ needs.metadata.outputs.tag }}" dist
      - name: Verify candidate inventory
        run: >-
          scripts/release/verify-assets.sh dist
          "${{ needs.metadata.outputs.archive }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.metadata.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  preflight:
    name: Preflight crates.io Trusted Publishing
    needs: metadata
    if: needs.metadata.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Issue and discard an ephemeral crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

  stage:
    name: Stage and verify GitHub prerelease
    needs: [metadata, candidate, preflight]
    if: >-
      !cancelled()
      && needs.metadata.result == 'success'
      && needs.candidate.result == 'success'
      && (
        (needs.metadata.outputs.is_prerelease == 'true'
          && needs.preflight.result == 'skipped')
        || (needs.metadata.outputs.is_prerelease == 'false'
          && needs.preflight.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.metadata.outputs.tag }}
          path: candidate
      - name: Stage, download, and verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/stage-github-release.sh
          "${{ needs.metadata.outputs.tag }}" candidate

  publish:
    name: Publish and verify crates.io workspace
    needs: [metadata, preflight, stage]
    if: >-
      !cancelled()
      && needs.metadata.outputs.is_prerelease == 'false'
      && needs.preflight.result == 'success'
      && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the workspace exactly once
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
      - name: Verify every crate from the public registry
        run: scripts/release/verify-crates-io.sh "${{ needs.metadata.outputs.version }}"

  promote:
    name: Promote GitHub release to latest
    needs: [metadata, stage, publish]
    if: >-
      !cancelled()
      && needs.metadata.outputs.is_prerelease == 'false'
      && needs.stage.result == 'success'
      && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Promote only after every package is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/promote-github-release.sh "${{ needs.metadata.outputs.tag }}"

  release-success:
    name: Release Success
    if: always()
    needs: [metadata, candidate, preflight, stage, publish, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete path for this release type
        env:
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          STAGE_RESULT: ${{ needs.stage.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          test "$METADATA_RESULT" = success
          test "$CANDIDATE_RESULT" = success
          test "$STAGE_RESULT" = success
          if [[ "$IS_PRERELEASE" == true ]]; then
            test "$PREFLIGHT_RESULT" = skipped
            test "$PUBLISH_RESULT" = skipped
            test "$PROMOTE_RESULT" = skipped
          else
            test "$PREFLIGHT_RESULT" = success
            test "$PUBLISH_RESULT" = success
            test "$PROMOTE_RESULT" = success
          fi
