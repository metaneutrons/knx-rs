name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Author the release PR with a GitHub App token, not the default
      # GITHUB_TOKEN. GitHub blocks GITHUB_TOKEN-authored PRs/pushes from
      # triggering other workflows (recursion guard), so ci.yml never ran on the
      # release PR and its required checks stayed stuck. An App token is a real
      # actor, so its pushes DO fire ci.yml.
      # continue-on-error + the `|| secrets.GITHUB_TOKEN` fallback make this a
      # no-op until the two RELEASE_PLEASE_APP_* secrets exist: without them the
      # token step fails softly and release-please falls back to GITHUB_TOKEN
      # (i.e. the old close+reopen workaround still applies).
      - uses: actions/create-github-app-token@v2
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  verify:
    name: Verify before publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p knx-rs-core --no-default-features
      - run: cargo check -p knx-rs-device --no-default-features
      - run: cargo check -p knx-rs-tp --no-default-features

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check for CARGO_REGISTRY_TOKEN
        id: check_token
        run: |
          if [[ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
          fi

      # Publish in dependency order: core → device/tp → ip → prod
      - name: Publish knx-rs-core
        if: steps.check_token.outputs.has_token == 'true'
        run: cargo publish -p knx-rs-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "::warning::knx-rs-core already published or failed"

      - name: Publish knx-rs-device (with retry)
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          for i in 1 2 3; do
            cargo publish -p knx-rs-device --token ${{ secrets.CARGO_REGISTRY_TOKEN }} && break
            echo "::warning::Attempt $i failed, waiting 30s..."
            sleep 30
          done

      - name: Publish knx-rs-tp (with retry)
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          for i in 1 2 3; do
            cargo publish -p knx-rs-tp --token ${{ secrets.CARGO_REGISTRY_TOKEN }} && break
            echo "::warning::Attempt $i failed, waiting 30s..."
            sleep 30
          done

      - name: Publish knx-rs-ip (with retry)
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          for i in 1 2 3; do
            cargo publish -p knx-rs-ip --token ${{ secrets.CARGO_REGISTRY_TOKEN }} && break
            echo "::warning::Attempt $i failed, waiting 30s..."
            sleep 30
          done

      - name: Publish knx-rs-prod
        if: steps.check_token.outputs.has_token == 'true'
        run: cargo publish -p knx-rs-prod --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "::warning::knx-rs-prod already published or failed"
