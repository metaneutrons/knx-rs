# knxd as a KNXnet/IP tunnelling server: two tunnel clients under test attach
# to it. The unix and tcp servers let `knxtool` inject telegrams from inside.
#
# In knxd 0.14 "tunnel" and "router" of an ets_router server name a section
# (a boolean value would be taken as the name of a section), and routing is on
# as soon as "router" is present. Routing is left out on purpose: every
# container would otherwise multicast its telegrams to the others on the same
# Docker network.
[main]
addr = 0.0.1
client-addrs = 0.0.2:8
connections = server,dummy,unix,tcp
debug = dbg

[server]
server = ets_router
tunnel = tunnel
discover = true
port = 3671
debug = dbg

[tunnel]

[dummy]
driver = dummy

[unix]
server = knxd_unix
path = /run/knxd/knxd.sock

[tcp]
server = knxd_tcp
port = 6720

[dbg]
error-level = ${KNXD_ERROR_LEVEL}
trace-mask = ${KNXD_TRACE_MASK}
