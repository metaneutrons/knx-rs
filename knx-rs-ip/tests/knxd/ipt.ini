# knxd as a KNXnet/IP tunnelling client (driver "ipt") of the server under
# test at ${KNX_HOST}:${KNX_PORT}, plus a tunnelling server of its own that a
# test client attaches to in order to see what knxd forwards.
#
# knxd 0.14.61 only puts 0.0.0.0:0 (NAT mode) into its HPAIs when "nat-ip" is
# set, "nat = true" alone is not enough. NAT mode makes the server answer to
# the source address of the datagrams, which is what a container needs.
[main]
addr = 0.0.1
client-addrs = 0.0.2:8
connections = server,ipt,unix,tcp
debug = dbg

[server]
server = ets_router
tunnel = tunnel
discover = true
port = 3671
debug = dbg

[tunnel]

[ipt]
driver = ipt
ip-address = ${KNX_HOST}
dest-port = ${KNX_PORT}
nat = true
nat-ip = 0.0.0.0
heartbeat-timer = ${KNX_HEARTBEAT}
heartbeat-retries = ${KNX_HEARTBEAT_RETRIES}
# Without the retry filter knxd exits ("Link down, terminating") as soon as the
# tunnelling server fails; the driver does not insert it by itself for ipt.
filters = rt
debug = dbg

[rt]
filter = retry
may-fail = true
max-retries = 0
retry-delay = ${KNX_RETRY_DELAY}

[unix]
server = knxd_unix
path = /run/knxd/knxd.sock

[tcp]
server = knxd_tcp
port = 6720

[dbg]
error-level = ${KNXD_ERROR_LEVEL}
trace-mask = ${KNXD_TRACE_MASK}
