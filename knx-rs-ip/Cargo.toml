[package]
name = "knx-rs-ip"
description = "KNXnet/IP tunnel, routing, and discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
homepage.workspace = true
documentation = "https://docs.rs/knx_rs_ip"
keywords = ["knx", "home-automation", "knxnet-ip", "tunnel", "multicast"]
categories = ["network-programming", "hardware-support"]

[dependencies]
knx-rs-core.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "macros", "rt"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
knx-rs-device.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
