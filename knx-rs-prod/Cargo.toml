[package]
name = "knx-rs-prod"
description = "Cross-platform .knxprod generator for KNX ETS product databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/knx_rs_prod"
keywords = ["knx", "ets", "knxprod", "home-automation", "signing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64.workspace = true
md-5.workspace = true
quick-xml.workspace = true
regex.workspace = true
thiserror.workspace = true
zip.workspace = true
tempfile.workspace = true

[dependencies.clap]
workspace = true
optional = true

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "knx-rs-prod"
required-features = ["cli"]

[lints]
workspace = true
