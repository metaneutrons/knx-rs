[package]
name = "knx-rs-prod"
description = "Cross-platform .knxprod generator for KNX ETS product databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/knx_rs_prod"
keywords = ["knx", "ets", "knxprod", "home-automation", "signing"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64.workspace = true
md-5.workspace = true
quick-xml.workspace = true
regex.workspace = true
thiserror.workspace = true
zip.workspace = true
tempfile.workspace = true

# RSA signing of the M-XXXX product folder (the ETS `.signature`). Core to a
# usable `.knxprod`, so always compiled in. The signing key is always supplied
# by the caller at runtime — never bundled.
rsa = { version = "0.9", features = ["pem"] }
sha1 = { version = "0.10", features = ["oid"] }
# Optional: download knx_master.xml from update.knx.org (pulls in a TLS stack).
ureq = { version = "2", optional = true }

[dependencies.clap]
workspace = true
optional = true

[dev-dependencies]
rand = "0.8"

[features]
default = ["cli"]
cli = ["dep:clap"]
# Fetch knx_master.xml over HTTPS instead of supplying it as a path.
fetch = ["dep:ureq"]

[[bin]]
name = "knx-rs-prod"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
