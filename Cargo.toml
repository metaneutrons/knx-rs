[workspace]
resolver = "2"
members = [
  "knx-rs-core",
  "knx-rs-ip",
  "knx-rs-device",
  "knx-rs-tp",
  "knx-rs-prod",
  "examples/knx-rs-demo-device",
  "examples/knx-rs-demo-client",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/metaneutrons/knx-rs"
homepage = "https://github.com/metaneutrons/knx-rs"
authors = ["Fabian Schmieder"]

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
knx-rs-core = { path = "knx-rs-core", version = "0.8.0", default-features = false }
knx-rs-device = { path = "knx-rs-device", version = "0.8.0" }
knx-rs-ip = { path = "knx-rs-ip", version = "0.8.0" }
libm = "0.2"
md-5 = "0.11.0"
quick-xml = "0.41.0"
regex = "1.11.1"
serde = { version = "1", default-features = false }
serde_json = "1"
socket2 = "0.6"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
